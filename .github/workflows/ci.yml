name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["core", "mcp"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install the package itself (console script + import) plus the dev
          # tooling the suite drives (pytest, ruff, pip-audit, pyyaml). The mcp
          # matrix adds the remote extra (honors the mcp<2 pin). The core
          # matrix stays stdlib-only for the package's own runtime deps.
          if [ "${{ matrix.extras }}" = "mcp" ]; then
            pip install -e ".[dev,remote]"
          else
            pip install -e ".[dev]"
          fi
      - name: Lint (advisory)
        run: ruff check deye || true
      - name: Tests
        run: pytest -q -rs
      - name: SBOM (declared)
        run: python scripts/gen_sbom.py sbom-declared.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.extras }}
          path: sbom-declared.json
