name: Publish validated release

# Creates the v0.2.0-validated tag + GitHub release automatically, using the
# built-in GITHUB_TOKEN. Idempotent: if the release already exists it does
# nothing. Runs on push to main and can also be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag + release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.2.0-validated"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --title "D-Eye 0.2.0 (validated)" \
            --notes-file CHANGELOG.md \
            --target "${GITHUB_SHA}"
          echo "Created release $TAG at ${GITHUB_SHA}"
