[project]
name = "deye"
version = "0.2.0"
description = "D-Eye -- a FOSS-first capability and evidence layer for AI agents (MCP + CLI)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "D-Eye contributors"}]
keywords = ["mcp", "agent", "capability-router", "evidence", "provenance", "ssrf", "foss"]
dependencies = []  # core vertical slice is standard-library only, by design

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]  # FastMCP API; mcp 2.x renamed it to MCPServer (breaking)
secrets = ["keyring>=24.0"]
remote = ["mcp[cli]>=1.0,<2", "uvicorn>=0.30", "starlette>=0.37"]
rich = ["feedparser>=6.0", "requests>=2.28"]
browser = ["playwright>=1.40"]  # opt-in local browser adapter; off by default
dev = ["pytest>=8.0", "ruff>=0.8", "pip-audit>=2.7"]  # pip-audit runs the live OSV security test

[project.scripts]
deye = "deye.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deye"]

[tool.ruff]
target-version = "py310"
line-length = 100
